name: bhargavimilk
description: "MilkRoute - Milk Distribution & Shop Management"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.13.1
  firebase_auth: ^5.5.4
  cloud_firestore: ^5.6.9
  google_sign_in: ^6.2.2

  # PDF & Printing
  pdf: ^3.11.1
  printing: ^5.13.2
  intl: ^0.20.2
  razorpay_flutter: ^1.4.6
  cloud_functions: ^5.6.2
  google_fonts: ^8.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_launcher_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/app_launcher_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/fonts/NotoSans-Regular.ttf
    - assets/fonts/NotoSans-Bold.ttf
    - assets/fonts/NotoSansDevanagari-Regular.ttf
    - assets/fonts/NotoSansDevanagari-Bold.ttf
    - assets/images/

